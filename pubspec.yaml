name: kid_guard
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  intl: ^0.20.2
  record: ^6.2.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  dio: ^5.9.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/icon.png" # اتأكدت إنها image حسب الـ assets تحت
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/image/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/image/